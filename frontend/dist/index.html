<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Field Photo Capture</title><link rel="icon" href="appicon.png"><link rel="stylesheet" href="style.css"><style>.brand-icon{width:42px;height:42px;border-radius:9px;vertical-align:middle;margin-right:10px}</style></head>
<body><main>
  <section class="camera-panel">
    <div class="preview"><video id="video" autoplay muted playsinline></video><div id="cameraMessage">Select Start camera</div><div id="watermarkMarker" tabindex="0" role="slider" aria-label="Watermark position and size. Drag to move; use the corner grip to resize." title="Drag to position the photo watermark"><strong>2026-09-03 10:37:12</strong><span>User · GPS coordinates</span><small>Address · nearby roads</small><button id="watermarkResize" type="button" aria-label="Resize watermark" title="Drag to resize watermark"></button></div></div>
    <div class="gallery-wrap"><div id="emptyGallery">Captured photos will appear here</div><div id="gallery"></div></div>
  </section>
  <aside>
    <div class="app-header"><h1><img class="brand-icon" src="appicon.png" alt="">FIELD PHOTO</h1><div class="view-controls" aria-label="Display controls"><span id="themeName"></span><button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button><button id="zoomReset" title="Reset zoom to 100%">100%</button><button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button><button id="themeToggle" title="Theme" aria-label="Change color theme"><svg class="theme-icon hc-light-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg><svg class="theme-icon hc-dark-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.2 15.3A8.5 8.5 0 0 1 8.7 3.8 8.5 8.5 0 1 0 20.2 15.3Z"/></svg><svg class="theme-icon pretty-light-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="girl-hair" d="M5 21c0-4 2-6 4.4-7.2A6 6 0 0 1 6 8.4C6 4.8 8.6 2 12 2s6 2.8 6 6.4a6 6 0 0 1-3.4 5.4C17 15 19 17 19 21Z"/><circle class="girl-face" cx="12" cy="9" r="4"/><path class="girl-smile" d="M10 10.5c1.2 1 2.8 1 4 0"/></svg><svg class="theme-icon pretty-dark-icon" viewBox="0 0 24 24" aria-hidden="true"><path class="girl-hair" d="M5 21c0-4 2-6 4.4-7.2A6 6 0 0 1 6 8.4C6 4.8 8.6 2 12 2s6 2.8 6 6.4a6 6 0 0 1-3.4 5.4C17 15 19 17 19 21Z"/><circle class="girl-face" cx="12" cy="9" r="4"/><path class="girl-smile" d="M10 10.5c1.2 1 2.8 1 4 0"/><path class="girl-star" d="m19 2 .6 1.4L21 4l-1.4.6L19 6l-.6-1.4L17 4l1.4-.6Z"/></svg></button></div></div><label>Operator<input id="user"></label><label>Camera<select id="camera"></select></label><button id="startCamera">Start camera</button>
    <label class="check"><input type="checkbox" id="manual"> Use manual location (development)</label>
    <div class="coordinate-pair"><label>Latitude<input id="latitude" type="number" step="any"></label><label>Longitude<input id="longitude" type="number" step="any"></label></div>
    <label>Location label (optional)<input id="address"></label><label class="check"><input type="checkbox" id="reverse"> Reverse-geocode GPS location</label>
    <label>Output folder<div class="folder"><input id="output"><button id="browse" title="Browse">…</button></div></label>
  </aside>
  <footer><div id="status">Ready</div><button id="capture" disabled>CAPTURE PHOTO</button></footer>
</main><canvas id="canvas" hidden></canvas><script src="app.js"></script></body></html>
